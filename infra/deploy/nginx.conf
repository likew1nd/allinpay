server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 32m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location ~ ^/(login)?$ {
        auth_request /_epay_install_check;
        error_page 403 = @epay_install;
        try_files /index.html =404;
    }
    location @epay_install {
        absolute_redirect off;
        return 302 /v1/install;
    }
    location = /_epay_install_check {
        internal;
        proxy_pass http://api:9528/v1/route/getConstantRoutes;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
    }
    location = /v1/install {
        client_max_body_size 16k;
        proxy_read_timeout 300s;
        proxy_pass http://api:9528;
    }
    location /v1/ { proxy_pass http://api:9528; }
    location / { try_files $uri $uri/ /index.html; }
}
