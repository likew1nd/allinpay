server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 32m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location ~ ^/(login)?$ {
        auth_request /_epay_install_check;
        error_page 403 = @epay_install;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location @epay_install {
        absolute_redirect off;
        return 302 /v1/install;
    }
    location = /_epay_install_check {
        internal;
        proxy_pass http://api:9528/v1/route/getConstantRoutes;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
    }
    location = /v1/install {
        client_max_body_size 16k;
        proxy_read_timeout 300s;
        proxy_pass http://api:9528;
    }
    location /v1/ { proxy_pass http://api:9528; }
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.[^/]+$" {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/javascript text/css application/json application/wasm image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ { try_files $uri =404; }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ /index.html; }
}
