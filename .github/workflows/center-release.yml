name: 发布中心
on:
  push:
    tags: ['center-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送的中心版本标签
        required: true
        type: string
permissions:
  contents: write
  packages: write
concurrency: center-release
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 校验版本并登录镜像仓库
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^center-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: 构建镜像并生成 Compose 文件
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-center"
          build() {
            local service="$1" tag="$image:$1-$RELEASE_TAG" digest
            docker buildx build --platform linux/amd64 --file infra/deploy/Dockerfile --target "$service" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --tag "$tag" --push --metadata-file "$RUNNER_TEMP/$service.json" . >&2
            digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/$service.json")
            printf '%s@%s\n' "$image" "$digest"
          }
          render() {
            sed -e "s|@API_IMAGE@|$api|g" \
              -e "s|@WEB_IMAGE@|$web|g" \
              -e "s|@UPDATER_IMAGE@|$1|g" \
              -e "s|@RELEASE_VERSION@|${RELEASE_TAG#center-v}|g" \
              -e "s|@REPOSITORY@|$GITHUB_REPOSITORY|g" infra/deploy/compose.release.yaml
          }
          api=$(build api)
          web=$(build web)
          # 镜像内清单供更新器启动时记录当前版本，正式附件使用更新器自身的摘要。
          render "$image:updater-$RELEASE_TAG" > infra/deploy/release-compose.yaml
          updater=$(build updater)
          render "$updater" > compose.pull.yaml
          sh -n infra/deploy/deploy.sh
          EPAY_IMAGE_MIRROR= docker compose -f compose.pull.yaml config --format json | jq -e \
            'all(.services[]; .image and (has("build") | not)) and (.services | keys == ["api","redis","updater","web"])'
          EPAY_IMAGE_MIRROR=git.5588.la/ docker compose --profile maintenance -f compose.pull.yaml config --format json | jq -e \
            'all(.services[]; .image | startswith("git.5588.la/"))'
          printf '%s\n' "$api" "$web" "$updater" > "$RUNNER_TEMP/center-images"
      - name: 验证部署端可以匿名拉取公开镜像
        if: ${{ !github.event.repository.private }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          while IFS= read -r image; do
            docker manifest inspect "$image" > /dev/null || {
              echo "::error::镜像 $image 无法匿名拉取。请检查 GHCR 包的公开权限后重新运行发布。"
              exit 1
            }
          done < "$RUNNER_TEMP/center-images"
      - name: 发布完整版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "$RELEASE_TAG" \
            --notes-file "infra/deploy/release-notes/$RELEASE_TAG.md" \
            compose.pull.yaml infra/deploy/epayctl infra/deploy/deploy.sh
